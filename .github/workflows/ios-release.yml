name: Build and Upload to App Store

on:
  workflow_dispatch:   # lets you trigger it manually from the GitHub Actions tab

jobs:
  build:
    runs-on: macos-15   # GitHub's newest macOS runner, ships with recent Xcode

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          echo "$CERT_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain

      - name: Import provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Force manual signing in project file
        run: |
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' Germanium.xcodeproj/project.pbxproj

      - name: Show effective build settings (debug)
        run: |
          xcodebuild -showBuildSettings -project "Germanium.xcodeproj" -scheme "Germanium" -configuration Release | grep -i "PRODUCT_BUNDLE_IDENTIFIER\|PROVISIONING_PROFILE\|CODE_SIGN"

      - name: Archive
        run: |
          xcodebuild -project "Germanium.xcodeproj" \
            -scheme "Germanium" \
            -configuration Release \
            -archivePath build/Germanium.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Germanium App Store Profile" \
            DEVELOPMENT_TEAM=598KF94K56 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Germanium.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -f build/Germanium.ipa -t ios \
            -u "$APPLE_ID" -p "$APP_SPECIFIC_PASSWORD"
